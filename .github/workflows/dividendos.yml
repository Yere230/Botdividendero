name: Revisar dividendos

on:
  schedule:
    - cron: "0 12 * * 1-5"   # lunes a viernes, ~8-9 AM hora de Chile
  workflow_dispatch:
    inputs:
      prueba:
        description: "Modo prueba (envía un mensaje de verificación)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_PRUEBA: ${{ github.event.inputs.prueba == 'true' && '1' || '0' }}
        run: python dividendos.py

      - name: Guardar estado
        run: |
          git config user.name "bot-dividendos"
          git config user.email "bot-dividendos@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || (git commit -m "Actualizar estado" && git push)
